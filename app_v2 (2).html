<title>شركة العطاء | نظام إدارة الموظفين والسيارات وجوازات القيادة</title>
<style>
:root{
  --navy:#0f2b46; --navy2:#17436b; --gold:#f2c200; --sky:#4fc3f7; --cyan:#00bcd4;
  --bg:#eef3f8; --card:#ffffff; --line:#d5e1ec; --txt:#12283c; --muted:#5b7285;
  --ok:#12805c; --warn:#b26a00; --bad:#c0392b; --shadow:0 2px 10px rgba(15,43,70,.08);
  --radius:14px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  font-family:"Segoe UI","Tahoma",Arial,sans-serif;background:var(--bg);color:var(--txt);
  font-size:15px;line-height:1.6;direction:rtl;
}
a{color:var(--navy2)}
h1,h2,h3,h4{margin:0 0 8px;line-height:1.35}
h1{font-size:1.35rem}h2{font-size:1.15rem}h3{font-size:1rem}
header.top{
  background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;
  padding:12px 16px;display:flex;align-items:center;gap:12px;flex-wrap:wrap;
  position:sticky;top:0;z-index:50;box-shadow:0 2px 12px rgba(0,0,0,.18)
}
header.top .logo{
  width:42px;height:42px;border-radius:12px;background:var(--gold);color:var(--navy);
  display:grid;place-items:center;font-weight:800;font-size:1.1rem;flex:0 0 auto
}
header.top .ttl{flex:1 1 auto;min-width:150px}
header.top .ttl b{display:block;font-size:1.05rem}
header.top .ttl span{font-size:.78rem;opacity:.85}
header.top .who{font-size:.78rem;text-align:left;opacity:.95}
.wrap{max-width:1400px;margin:0 auto;padding:14px}
nav.tabs{
  display:flex;gap:6px;overflow-x:auto;padding:8px 10px;background:#fff;
  border-bottom:1px solid var(--line);position:sticky;top:66px;z-index:40;
  scrollbar-width:thin
}
nav.tabs button{
  flex:0 0 auto;border:1px solid var(--line);background:#f6f9fc;color:var(--txt);
  padding:8px 14px;border-radius:999px;font-size:.86rem;font-weight:600;cursor:pointer;
  white-space:nowrap
}
nav.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:14px;margin-bottom:14px;box-shadow:var(--shadow)}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
@media(max-width:900px){.g3,.g4{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:620px){.g2,.g3,.g4{grid-template-columns:1fr}body{font-size:14.5px}}
label{display:block;font-size:.8rem;font-weight:700;color:var(--muted);margin:8px 0 4px}
input,select,textarea{
  width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:10px;
  font-family:inherit;font-size:.92rem;background:#fff;color:var(--txt)
}
input:focus,select:focus,textarea:focus{outline:2px solid var(--sky);border-color:var(--sky)}
button.btn{
  border:0;border-radius:10px;padding:10px 16px;font-weight:700;font-size:.9rem;cursor:pointer;
  background:var(--navy);color:#fff;font-family:inherit
}
button.btn:hover{background:var(--navy2)}
button.btn.gold{background:var(--gold);color:var(--navy)}
button.btn.ghost{background:#eef3f8;color:var(--navy);border:1px solid var(--line)}
button.btn.danger{background:var(--bad)}
button.btn.sm{padding:6px 10px;font-size:.78rem;border-radius:8px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.kpi{background:#fff;border:1px solid var(--line);border-radius:var(--radius);padding:12px;box-shadow:var(--shadow)}
.kpi b{display:block;font-size:1.7rem;line-height:1.2}
.kpi span{font-size:.8rem;color:var(--muted);font-weight:700}
.kpi.bad b{color:var(--bad)}.kpi.warn b{color:var(--warn)}.kpi.ok b{color:var(--ok)}
.tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;background:#fff}
table{border-collapse:collapse;width:100%;min-width:900px;font-size:.82rem}
table th,table td{border:1px solid var(--line);padding:6px 8px;text-align:right;vertical-align:middle;white-space:nowrap}
table thead th{background:var(--gold);color:#0b2033;font-weight:800;position:sticky;top:0;z-index:2}
table thead th.blue{background:var(--sky);color:#062033}
table thead th.gray{background:#dde7f0}
table tbody tr:nth-child(even){background:#f4f9fd}
table tbody tr:hover{background:#e6f4ff}
.pill{display:inline-block;padding:2px 9px;border-radius:999px;font-size:.72rem;font-weight:800;border:1px solid transparent}
.pill.ok{background:#e3f7ef;color:var(--ok);border-color:#b6e8d6}
.pill.warn{background:#fff5e0;color:var(--warn);border-color:#f3dca6}
.pill.bad{background:#fdecea;color:var(--bad);border-color:#f6c7c0}
.pill.info{background:#e8f4fd;color:#0d5c8c;border-color:#c2e2f7}
.login{min-height:100vh;display:grid;place-items:center;background:linear-gradient(135deg,#0f2b46,#1b5580 60%,#0f2b46);padding:16px}
.login .box{background:#fff;border-radius:18px;padding:22px;width:100%;max-width:430px;box-shadow:0 20px 50px rgba(0,0,0,.3)}
.login .brand{display:flex;gap:10px;align-items:center;margin-bottom:14px}
.login .brand .logo{width:48px;height:48px;border-radius:14px;background:var(--gold);color:var(--navy);display:grid;place-items:center;font-weight:800}
.seg{display:flex;gap:6px;background:#eef3f8;padding:4px;border-radius:12px;margin-bottom:12px}
.seg button{flex:1;border:0;background:transparent;padding:9px;border-radius:9px;font-weight:700;cursor:pointer;font-family:inherit;font-size:.85rem;color:var(--muted)}
.seg button.on{background:#fff;color:var(--navy);box-shadow:var(--shadow)}
.note{background:#f4f9fd;border:1px dashed var(--sky);border-radius:12px;padding:10px;font-size:.82rem;color:var(--muted)}
.alertrow{display:flex;gap:8px;align-items:center;padding:8px;border:1px solid var(--line);border-radius:10px;margin-bottom:6px;background:#fff}
.alertrow.bad{border-color:#f6c7c0;background:#fef7f6}
.alertrow.warn{border-color:#f3dca6;background:#fffdf5}
.alertrow .t{flex:1;min-width:0}
.alertrow .t b{display:block;font-size:.88rem}
.alertrow .t small{color:var(--muted)}
.hidden{display:none!important}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:flex;align-items:center;gap:6px;border:1px solid var(--line);border-radius:999px;padding:5px 10px;font-size:.8rem;background:#fff;cursor:pointer}
.chip input{width:auto;margin:0}
.sec-head{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:10px}
.muted{color:var(--muted);font-size:.82rem}
.filelist a{display:inline-flex;gap:6px;align-items:center;background:#eef3f8;border:1px solid var(--line);border-radius:8px;padding:4px 8px;font-size:.78rem;text-decoration:none;margin:2px}
footer.foot{text-align:center;color:var(--muted);font-size:.78rem;padding:18px}
@media print{nav.tabs,header.top,.noprint,footer.foot{display:none!important}.card{box-shadow:none;break-inside:avoid}table{min-width:0;font-size:.7rem}table thead th{position:static}}
.tblwrap{max-width:100%}
@media(max-width:620px){table{min-width:720px}header.top{padding:10px 12px}header.top .logo{width:36px;height:36px}}


/* ==================== REFINED THEME v2 ==================== */
:root{
  --navy:#0b2338; --navy2:#123a5c; --gold:#e6b422; --sky:#38b6ff;
  --bg:#f4f7fb; --card:#fff; --line:#e3ebf3; --txt:#0f2436; --muted:#64798c;
  --ok:#0f7a56; --warn:#a86400; --bad:#b5322a;
  --shadow:0 1px 2px rgba(11,35,56,.04),0 6px 18px rgba(11,35,56,.06);
  --radius:16px;
}
body{font-size:14.6px;letter-spacing:.1px;background:var(--bg)}
header.top{
  background:linear-gradient(120deg,#0b2338 0%,#123a5c 58%,#0d2c46 100%);
  padding:9px 18px;gap:14px;border-bottom:3px solid var(--gold);
  box-shadow:0 4px 22px rgba(11,35,56,.24)
}
header.top .brandlogo{display:flex;align-items:center;flex:0 0 auto;padding-inline-end:14px;border-inline-end:1px solid rgba(255,255,255,.18)}
header.top .ttl b{font-size:1.02rem;letter-spacing:.2px}
header.top .ttl span{font-size:.73rem;opacity:.78}
header.top .who{font-size:.76rem;line-height:1.5}
nav.tabs{
  top:64px;padding:9px 14px;gap:7px;background:rgba(255,255,255,.97);
  backdrop-filter:blur(8px);border-bottom:1px solid var(--line)
}
nav.tabs button{
  border:1px solid var(--line);background:#fff;padding:7px 15px;font-size:.83rem;
  font-weight:700;color:#3c556b;border-radius:10px;transition:.15s
}
nav.tabs button:hover{border-color:#bcd2e6;color:var(--navy)}
nav.tabs button.on{background:var(--navy);border-color:var(--navy);color:#fff;box-shadow:0 3px 12px rgba(11,35,56,.24)}
.wrap{padding:16px;max-width:1440px}
.card{border:1px solid var(--line);border-radius:var(--radius);padding:16px;box-shadow:var(--shadow);margin-bottom:16px}
.card>h2,.card>h3{padding-bottom:9px;border-bottom:1px solid #eef3f8;margin-bottom:13px}
.sec-head h2{margin:0;border:0;padding:0}
.sec-head{border-bottom:1px solid #eef3f8;padding-bottom:10px;margin-bottom:12px}
.kpi{position:relative;padding:14px 14px 12px;border-radius:14px;overflow:hidden}
.kpi:before{content:'';position:absolute;top:0;inset-inline-start:0;width:4px;height:100%;background:var(--sky)}
.kpi b{font-size:1.55rem;font-weight:800;letter-spacing:-.5px}
.kpi span{font-size:.75rem;font-weight:700;color:var(--muted)}
.kpi.ok:before{background:var(--ok)}.kpi.warn:before{background:var(--warn)}.kpi.bad:before{background:var(--bad)}
table{font-size:.8rem}
table th,table td{padding:7px 9px}
table thead th{background:#eef3f8;color:#123a5c;font-weight:800;border-bottom:2px solid #d7e3ee}
table thead th.blue{background:#dff0fb;color:#0b4c73}
table tbody tr:nth-child(even){background:#fafcfe}
table tbody tr:hover{background:#eef7ff}
table.excel thead th{background:var(--gold);color:#231a00;border-bottom:2px solid #c99f00}
table.excel thead th.blue{background:#bfe8ff;color:#083b5c;border-bottom:2px solid #7cc8ea}
.pill{padding:3px 10px;font-size:.71rem}
.btn{border-radius:10px;padding:9px 15px;font-size:.86rem;box-shadow:0 1px 2px rgba(11,35,56,.08)}
.btn.gold{background:var(--gold);color:#2b1f00}
.btn.gold:hover{background:#f0c33c}
.btn.ghost{background:#fff;border:1px solid var(--line);color:#123a5c}
.btn.ghost:hover{background:#f4f9fd}
input,select,textarea{border-radius:10px;border-color:#dbe6ef;background:#fbfdff}
input:focus,select:focus,textarea:focus{outline:2px solid rgba(56,182,255,.3);border-color:var(--sky)}
label{font-size:.78rem;letter-spacing:.1px}
.note{background:#f6fafd;border:1px solid #e0ecf6;border-inline-start:3px solid var(--sky);border-radius:10px}
.alertrow{border-radius:11px;padding:9px 11px}
.login{background:radial-gradient(1200px 620px at 72% -12%,#1b5580 0%,#0b2338 62%)}
.login .box{border-radius:20px;padding:26px;max-width:440px;box-shadow:0 26px 70px rgba(3,15,26,.5)}
.login .brand{gap:14px;padding-bottom:14px;border-bottom:1px solid #eef3f8}
.login .brand b{font-size:1.15rem;display:block}
.seg{background:#eef3f8;border-radius:12px}
footer.foot{border-top:1px solid var(--line);margin-top:8px;padding:16px;opacity:.85}
.printhead{display:none}
@media print{
  .printhead{display:flex;align-items:center;gap:10px;padding:8px 0 12px;border-bottom:2px solid var(--navy);margin-bottom:12px}
  .printhead b{font-size:1.05rem}
}

const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const today=()=>new Date().toISOString().slice(0,10);
const days=(d)=>{ if(!d) return null; const t=new Date(d+'T00:00:00'); if(isNaN(t)) return null;
  return Math.round((t-new Date(today()+'T00:00:00'))/86400000); };
const fmtDate=d=>{ if(!d) return '—'; const t=new Date(d+'T00:00:00'); if(isNaN(t)) return esc(d);
  return t.toLocaleDateString('en-GB',{day:'2-digit',month:'short',year:'numeric'}); };
async function sha256(txt){
  if(window.crypto&&crypto.subtle){
    const b=await crypto.subtle.digest('SHA-256',new TextEncoder().encode('ataa$'+txt));
    return Array.from(new Uint8Array(b)).map(x=>x.toString(16).padStart(2,'0')).join('');
  }
  let h=0;const s='ataa$'+txt;for(let i=0;i<s.length;i++){h=(h*31+s.charCodeAt(i))>>>0;}return 'fb'+h.toString(16);
}
function statusOf(date,thr){
  const d=days(date);
  if(d===null) return {k:'info',t:'غير محدد',cls:'info'};
  if(d<0) return {k:'bad',t:'منتهي منذ '+Math.abs(d)+' يوم',cls:'bad'};
  if(d<=thr) return {k:'warn',t:'ينتهي خلال '+d+' يوم',cls:'warn'};
  return {k:'ok',t:'ساري ('+d+' يوم متبقي)',cls:'ok'};
}

const CLOUD={
  enabled:false,
  url:'',      // مثال: https://xxxxx.supabase.co
  key:'',      // anon public key
  table:'ataa_state'
};
async function cloudPush(){
  if(!CLOUD.enabled||!CLOUD.url||!CLOUD.key) throw new Error('لم يتم ضبط الاتصال السحابي');
  const r=await fetch(CLOUD.url.replace(/\/$/,'')+'/rest/v1/'+CLOUD.table,{
    method:'POST',
    headers:{'apikey':CLOUD.key,'Authorization':'Bearer '+CLOUD.key,'Content-Type':'application/json','Prefer':'resolution=merge-duplicates'},
    body:JSON.stringify([{id:'main',data:DB,updated:new Date().toISOString()}])
  });
  if(!r.ok) throw new Error('فشل الإرسال ('+r.status+')');
  return true;
}
async function cloudPull(){
  if(!CLOUD.enabled||!CLOUD.url||!CLOUD.key) throw new Error('لم يتم ضبط الاتصال السحابي');
  const r=await fetch(CLOUD.url.replace(/\/$/,'')+'/rest/v1/'+CLOUD.table+'?id=eq.main&select=data',{
    headers:{'apikey':CLOUD.key,'Authorization':'Bearer '+CLOUD.key}});
  if(!r.ok) throw new Error('فشل السحب ('+r.status+')');
  const j=await r.json();
  if(j&&j[0]&&j[0].data){ DB=j[0].data; save(); return true; }
  return false;
}

async function loginManager(user,pass,code){
  const h=await sha256(pass);
  const m=DB.managers.find(x=>x.user.toLowerCase()===String(user).trim().toLowerCase());
  if(!m) return {err:'اسم المستخدم غير موجود'};
  if(m.pass!==h) return {err:'كلمة المرور غير صحيحة'};
  if(m.code!==String(code).trim()) return {err:'رمز المدير (Code) غير صحيح'};
  SES={type:'manager',id:m.id,name:m.name,role:m.role,seg:m.seg||''};
  localStorage.setItem(LS_SES,JSON.stringify(SES)); logAct('دخول المدير: '+m.name);
  return {ok:true};
}
async function loginEmployee(gin,pass){
  const h=await sha256(pass);
  const e=DB.employees.find(x=>String(x.gin).trim()===String(gin).trim());
  if(!e) return {err:'رقم الـ GIN غير موجود'};
  if(e.pass!==h) return {err:'كلمة المرور غير صحيحة'};
  SES={type:'employee',id:e.id,name:e.name,role:'employee',seg:e.segment||''};
  localStorage.setItem(LS_SES,JSON.stringify(SES)); logAct('دخول الموظف: '+e.name);

}

      s:'رقم الجواز: '+(e.lic||'—')+' • ينتهي '+fmtDate(e.licTo)+' • '+L.t,
      emp:e.id,mobile:e.mobile,msg:'تنبيه إداري: جواز قيادة الموظف '+e.name+' ('+(e.lic||'')+') '+L.t+'. الرجاء المتابعة.'});
    const M=statusOf(e.medTo,thr);
    if(M.k!=='ok') out.push({k:M.k,grp:'الفحص الطبي',t:e.name,
      s:'ينتهي '+fmtDate(e.medTo)+' • '+M.t,emp:e.id,mobile:e.mobile,
      msg:'تنبيه إداري: الفحص الطبي للموظف '+e.name+' '+M.t+'.'});
    if(!e.lic) out.push({k:'info',grp:'بيانات ناقصة',t:e.name,s:'لم يُسجَّل رقم جواز القيادة',emp:e.id,mobile:e.mobile,msg:'تنبيه: يرجى تزويدنا برقم جواز القيادة الخاص بك.'});
    const mi=missingItems(e.id);
    if(mi.length) out.push({k:'warn',grp:'نقص أغراض/فحص',t:e.name,s:'ناقص: '+mi.join('، '),emp:e.id,mobile:e.mobile,
      msg:'تنبيه: يوجد نقص في أغراض/مستلزمات الفحص للموظف '+e.name+': '+mi.join('، ')+'.'});
    const w=warnsOf(e.id);
    if(w>=2) out.push({k:'bad',grp:'إنذارات',t:e.name,s:'وصل عدد الإنذارات إلى '+w+' إنذار',emp:e.id,mobile:e.mobile,
      msg:'تنبيه: تم توجيه أكثر من إنذار للموظف '+e.name+'.'});
    const f=finesOf(e.id);
    if(f>0) out.push({k:'bad',grp:'غرامات',t:e.name,s:'إجمالي الغرامات: '+money(f),emp:e.id,mobile:e.mobile,
      msg:'تنبيه: إجمالي الغرامات المسجلة بحقك '+money(f)+'.'});
  });
  scopeVeh().forEach(v=>{
    const S=statusOf(v.expTo,thr);
    if(S.k!=='ok') out.push({k:S.k,grp:'انتهاء صلاحية السيارة',t:'سيارة '+v.plate+' — '+v.type,
      s:'ينتهي '+fmtDate(v.expTo)+' • '+S.t+((v.driver)?' • السائق: '+v.driver:''),emp:'',mobile:'',msg:''});
    if(!v.driver) out.push({k:'warn',grp:'بدون سائق',t:'سيارة '+v.plate,s:'لا يوجد سائق معيّن',emp:'',mobile:'',msg:''});
  });
  const rank={bad:0,warn:1,info:2,ok:3};
  return out.sort((a,b)=>rank[a.k]-rank[b.k]);
}

async function saveEmp(id){
  const g=Object.assign({},id?empById(id):{},{
    name:$('#f_name').value.trim(),job:$('#f_job').value.trim(),segment:$('#f_seg').value,
    gin:$('#f_gin').value.trim(),mobile:$('#f_mob').value.trim(),plate:$('#f_plate').value,
    lic:$('#f_lic').value.trim(),licFrom:$('#f_lf').value,licTo:$('#f_lt').value,
    medDate:$('#f_md').value,medTo:$('#f_mt').value,status:$('#f_st').value,notes:$('#f_note').value.trim()
  });
  if(!g.name||!g.gin){ alert('الاسم ورقم الـ GIN مطلوبان'); return; }
  if(id){ const i=DB.employees.findIndex(x=>x.id===id); DB.employees[i]=g; logAct('تعديل موظف: '+g.name); }
  else{ g.id=uid('emp'); g.certs=[]; g.pass=await sha256('1234'); g.created=today();
    DB.employees.push(g); logAct('إضافة موظف: '+g.name); }
  const v=DB.vehicles.find(x=>x.plate===g.plate); if(v) v.driver=g.name;
  save(); closeModal(); render();
}

  DB.checks=DB.checks.filter(c=>c.empId!==id);

  modal(`<h2>شهادات ووثائق الموظف (PDF)</h2>

function addCert(id){
  const f=$('#f_pdf').files[0]; if(!f){ alert('اختر ملفاً أولاً'); return; }
  if(f.size>1.6*1024*1024){ alert('حجم الملف كبير. الحد 1.6 ميجابايت.'); return; }
  const r=new FileReader();
  r.onload=()=>{ const e=DB.employees.find(x=>x.id===id); e.certs=e.certs||[];
    e.certs.push({name:f.name,title:$('#f_t').value.trim()||f.name,size:f.size,type:f.type,data:r.result,at:today()});
    logAct('إضافة شهادة للموظف '+e.name+': '+(f.name)); save(); openCert(id); };
  r.readAsDataURL(f);
}

const SHEET_COLS=[
  {k:'start',n:'Start Dt',c:'y'},{k:'release',n:'Release Dt',c:'y'},{k:'desc',n:'Item Description',c:'y'},
  {k:'plate',n:'Plate No.',c:'y'},{k:'reg',n:'Reg.',c:'y'},{k:'soc',n:'SOC',c:'y'},
  {k:'driver',n:'Driver / Operator',c:'y'},{k:'gin',n:'Employee number',c:'b'},
  {k:'mobile',n:'Mobile number',c:'b'},{k:'company',n:'Company',c:'b'},
  {k:'lic',n:'ROD Passport Number',c:'b'},{k:'licFrom',n:'Valid from',c:'b'},{k:'licTo',n:'Expiry date',c:'b'},
  {k:'segment',n:'Segment',c:'y'},{k:'owner',n:'OWNER',c:'y'},
  {k:'checklist',n:'operator & banksman (Check List)',c:'y'},{k:'certificate',n:'certificate',c:'y'},
  {k:'fines',n:'ATO / Fines',c:'y'},{k:'type',n:'Vehicle Type',c:'y'},{k:'status',n:'Status',c:'y'}
];
function sheetRows(){
  return scopeVeh().map(v=>{
    const e=DB.employees.find(x=>x.name===v.driver)||{};
    const last=lastCheck(e.id); const mi=missingItems(e.id);
    return {
      start:v.start,release:v.release,desc:v.desc,plate:v.plate,reg:v.reg,soc:v.soc,driver:v.driver||'',
      gin:e.gin||'',mobile:e.mobile||'',company:v.owner||'',lic:e.lic||'',licFrom:e.licFrom||'',licTo:e.licTo||'',
      segment:v.segment||'',owner:v.owner||'',
      checklist: last? (mi.length? 'ناقص: '+mi.join('، ') : 'مكتمل ✔') : 'غير مفحوص',
      certificate:(e.certs||[]).length? (e.certs.length+' ملف PDF') : '—',
      fines:finesOf(e.id)? money(finesOf(e.id)) : '—',
      type:v.type,status:v.active===false?'خارج الخدمة':'في الخدمة'
    };
  });
}
function vSheet(){
  const rows=sheetRows();
  return `
  <div class="card noprint">
    <div class="sec-head"><h2>جدول الإكسل — مطابق لملف الشركة (${rows.length} سجل)</h2>
      <div class="row">
        <button class="btn gold sm" onclick="exportXLSX()">تصدير Excel (.xlsx)</button>
        <button class="btn ghost sm" onclick="exportCSV()">تصدير CSV</button>
        <button class="btn ghost sm" onclick="window.print()">طباعة</button>
      </div></div>
    <div class="note">هذا الجدول مبني على أعمدة الملف الأصلي (Start Dt, Release Dt, Item Description, Plate No., Reg., SOC, Driver/Operator, Employee number, Mobile number, ROD Passport Number, Valid from, Expiry date, Segment, OWNER, Check List, certificate, ATO/Fines) مع إضافة عمودي نوع السيارة والحالة.</div>
  </div>
  <div class="card"><div class="tblwrap"><table class="excel"><thead><tr>
    ${SHEET_COLS.map(c=>`<th class="${c.c==='b'?'blue':''}">${c.n}</th>`).join('')}
  </tr></thead><tbody>
  ${rows.map(r=>`<tr>${SHEET_COLS.map(c=>{
    const v=r[c.k]; let cell=esc(v);
    if(c.k==='start'||c.k==='release'||c.k==='licFrom'||c.k==='licTo') cell=(v?fmtDate(v):'—');
    if(c.k==='status') cell=`<span class="pill ${v==='في الخدمة'?'ok':'bad'}">${esc(v)}</span>`;
    if(c.k==='fines') cell=v==='—'?'—':`<span class="pill bad">${esc(v)}</span>`;
    if(c.k==='checklist') cell=String(v).indexOf('ناقص')===0?`<span class="pill warn">${esc(v)}</span>`:(String(v).indexOf('مكتمل')===0?`<span class="pill ok">${esc(v)}</span>`:esc(v));
    return `<td>${cell}</td>`;}).join('')}</tr>`).join('')||'<tr><td colspan="20" class="muted">لا توجد بيانات</td></tr>'}
  </tbody></table></div></div>
  <div id="modal"></div>`;
}
function sheetAoA(){
  const head=SHEET_COLS.map(c=>c.n);
  const body=sheetRows().map(r=>SHEET_COLS.map(c=>{
    const v=r[c.k];
    if(c.k==='start'||c.k==='release'||c.k==='licFrom'||c.k==='licTo') return v?fmtDate(v):'';
    return v==null?'':String(v);
  }));
  return [head].concat(body);
}
function exportXLSX(){
  try{
    const wb=XLSX.utils.book_new();
    const ws=XLSX.utils.aoa_to_sheet(sheetAoA());
    ws['!cols']=SHEET_COLS.map(()=>({wch:16}));
    XLSX.utils.book_append_sheet(wb,ws,'Employees & Vehicles');
    const ws2=XLSX.utils.aoa_to_sheet([['التاريخ','الموظف','GIN','السيارة','النوع','الغرامة','السبب']].concat(
      scopeVio().map(v=>{const e=empById(v.empId);return [v.date,e.name||'',e.gin||'',e.plate||'',vName(v.type),v.amount,v.reason||''];})));
    XLSX.utils.book_append_sheet(wb,ws2,'Violations');
    const ws3=XLSX.utils.aoa_to_sheet([['التاريخ','الموظف','السيارة'].concat(CHECKLIST.map(c=>c.n)).concat(['ملاحظة'])].concat(
      scopeChk().map(c=>{const e=empById(c.empId);return [c.date,e.name||'',c.plate||''].concat(CHECKLIST.map(it=>c.items[it.id]?'سليم':'ناقص')).concat([c.note||'']);})));
    XLSX.utils.book_append_sheet(wb,ws3,'Check List');
    XLSX.writeFile(wb,'Ataa_System_'+today()+'.xlsx');
  }catch(err){ alert('تعذّر إنشاء ملف Excel (قد تكون مكتبة التصدير غير محمّلة). سيتم تصدير CSV بدلاً منه.'); exportCSV(); }
}
function exportCSV(){
  const aoa=sheetAoA();
  const csv='\ufeff'+aoa.map(r=>r.map(c=>'"'+String(c).replace(/"/g,'""')+'"').join(',')).join('\r\n');
  const a=document.createElement('a');
  a.href='data:text/csv;charset=utf-8,'+encodeURIComponent(csv);
  a.download='Ataa_System_'+today()+'.csv'; a.click();
}

async function saveMgr(id){
  const o={name:$('#m_name').value.trim(),user:$('#m_user').value.trim(),code:$('#m_code').value.trim(),
    role:$('#m_role').value,seg:$('#m_seg').value};
  if(!o.name||!o.user||!o.code){ alert('الاسم واسم المستخدم ورمز المدير مطلوبة'); return; }
  const p=$('#m_pass').value;
  if(id){ const m=DB.managers.find(x=>x.id===id); Object.assign(m,o); if(p) m.pass=await sha256(p);
    logAct('تعديل مدير: '+o.name); }
  else{ o.id=uid('mgr'); o.pass=await sha256(p||'1234'); o.created=today(); DB.managers.push(o);
    logAct('إضافة مدير: '+o.name); }
  save(); closeModal(); render();
}
function openMPass(id){ const m=DB.managers.find(x=>x.id===id);
  modal(`<h2>كلمة مرور المدير</h2>
  <div class="note">كلمة المرور مشفّرة (SHA-256). عيّن كلمة جديدة:</div>

  <button class="btn ghost" onclick="closeModal()">إلغاء</button></div>`); }
async function setMPass(id){ const m=DB.managers.find(x=>x.id===id); m.pass=await sha256($('#mp').value||'1234');
  logAct('تغيير كلمة مرور مدير: '+m.name); save(); closeModal(); alert('تم التعيين'); render(); }
function delMgr(id){ const m=DB.managers.find(x=>x.id===id);
  if(!confirm('حذف المدير '+m.name+'؟')) return;
  DB.managers=DB.managers.filter(x=>x.id!==id); logAct('حذف مدير: '+m.name); save(); render(); }

}
function saveSet(){ DB.settings.company=$('#s_co').value.trim()||APP; DB.settings.thr=Number($('#s_thr').value||30);
  logAct('تعديل الإعدادات'); save(); render(); }
function saveCloud(){ CLOUD.enabled=$('#c_en').value==='1'; CLOUD.url=$('#c_url').value.trim();
  CLOUD.key=$('#c_key').value.trim(); CLOUD.table=$('#c_tbl').value.trim()||'ataa_state';
  localStorage.setItem('ataa_cloud',JSON.stringify(CLOUD)); alert('تم حفظ إعدادات الربط السحابي'); }
async function doPush(){ saveCloud(); try{ await cloudPush(); alert('تم إرسال البيانات للسحابة بنجاح ✔'); }
  catch(e){ alert('فشل الإرسال: '+e.message+'\nتأكد من الرابط والمفتاح ومن إنشاء جدول باسم: '+CLOUD.table); } }
async function doPull(){ saveCloud(); try{ const ok=await cloudPull(); alert(ok?'تم سحب البيانات بنجاح ✔':'لا توجد بيانات في السحابة'); render(); }
  catch(e){ alert('فشل السحب: '+e.message); } }
function backup(){ const a=document.createElement('a');
  a.href='data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(DB,null,2));
  a.download='Ataa_Backup_'+today()+'.json'; a.click(); }
function restore(){ const f=$('#restoreF').files[0]; if(!f){alert('اختر ملف النسخة');return;}
  const r=new FileReader(); r.onload=()=>{ try{ const d=JSON.parse(r.result);
    if(!d.managers) throw 0; DB=d; save(); alert('تم الاستعادة'); render(); }catch(e){ alert('ملف غير صالح'); } };
  r.readAsText(f); }
function resetAll(){ if(!confirm('سيتم حذف كل البيانات والعودة للبيانات الأولية. متأكد؟')) return;
  localStorage.removeItem(LS_DB); DB=blank(); seed().then(()=>render()); }
